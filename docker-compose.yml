services:
  coach:
    build: .
    restart: unless-stopped
    env_file: .env
    # Bound to loopback on purpose. This is only here so the curl in CLAUDE.md
    # can reach the webhook receiver locally; a real delivery arrives through
    # Caddy on the VPS, never through this. Publishing it on
    # 0.0.0.0 would put the endpoint on your LAN for no gain. Note the receiver
    # opens no port at all unless INTERVALS_WEBHOOK_SECRET is set, so on a
    # default checkout this maps to nothing.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - vault:/vault
      - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro   # deploy key for the vault repo
      - ./.claude:/vault/.claude:ro                  # skills live alongside the vault

volumes:
  vault:
