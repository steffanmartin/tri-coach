# Applied to /etc/ssh/sshd_config.d/10-hardening.conf on the VPS.
#
# Kept out of bootstrap.sh on purpose: this is the one step that can strand you,
# so it is a deliberate act taken only after key login is proven for every
# account listed below.
#
# Port 22 stays open to the world rather than being source-restricted, because
# the deploy workflow SSHes in from GitHub-hosted runners, whose egress IPs are
# not pinnable. Key-only auth, AllowUsers, and fail2ban are the mitigation.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowTcpForwarding no
AllowUsers administrator deploy
