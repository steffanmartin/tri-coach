name: Deploy

# Builds the container image server-side with `az acr build` (matches the
# manual path in infra/README.md — correct even though runners are amd64
# already, since Container Apps only ever runs linux/amd64), pushes it to the
# ACR that main.bicep created, then re-deploys app.bicep with the new
# imageTag. activeRevisionsMode: Single means the new revision replaces the
# old one automatically — that's the "reload".

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-tri-coach

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Read straight from the main.bicep deployment record instead of
      # duplicating these as repo secrets — they're not sensitive and this
      # keeps the workflow in sync if platform.bicep is ever redeployed.
      - name: Resolve platform outputs
        id: platform
        run: |
          set -euo pipefail
          out=$(az deployment group show -g "$RESOURCE_GROUP" -n platform --query properties.outputs -o json)
          echo "acr_name=$(jq -r .acrName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(jq -r .acrLoginServer.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "environment_id=$(jq -r .environmentId.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "identity_id=$(jq -r .identityId.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "key_vault_uri=$(jq -r .keyVaultUri.value <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:7}"
          az acr build \
            -r "${{ steps.platform.outputs.acr_name }}" \
            -t "tri-coach:$tag" \
            --platform linux/amd64 \
            .
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy new revision
        run: |
          az deployment group create \
            -g "$RESOURCE_GROUP" \
            -f infra/app.bicep \
            -p infra/app.bicepparam \
            -p environmentId="${{ steps.platform.outputs.environment_id }}" \
            -p identityId="${{ steps.platform.outputs.identity_id }}" \
            -p acrLoginServer="${{ steps.platform.outputs.acr_login_server }}" \
            -p keyVaultUri="${{ steps.platform.outputs.key_vault_uri }}" \
            -p imageTag="${{ steps.build.outputs.tag }}"
