name: Deploy

# Builds the container image server-side with `az acr build` (matches the
# manual path in infra/README.md — correct even though runners are amd64
# already, since Container Apps only ever runs linux/amd64), pushes it to the
# ACR that main.bicep created, then re-deploys app.bicep with the new
# imageTag. activeRevisionsMode: Single means the new revision replaces the
# old one automatically — that's the "reload".
#
# When the push touches infra/, infra.yml runs first and re-deploys the
# platform resources, so the outputs this workflow resolves below are the ones
# the new templates just produced rather than the previous deployment's. It is
# a separate workflow, called with `secrets: inherit` so it authenticates as
# the same CI managed identity over OIDC — no second credential.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-tri-coach

jobs:
  # Which parts of the push need to run. deploy.yml has no `paths:` filter —
  # every push to main ships the app — so the infra decision is made here,
  # per-run, from the pushed range. A manual dispatch has no range to diff and
  # deploys everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect infra changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A branch's first push, or a force-push that dropped the old tip,
          # leaves nothing usable in `before` — fall back to the parent commit,
          # and to deploying infra if even that is missing.
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse --verify --quiet '${{ github.sha }}^' || true)"
          fi
          if [ -z "$base" ]; then
            infra=true
          elif git diff --name-only "$base" "${{ github.sha }}" | grep -q '^infra/'; then
            infra=true
          else
            infra=false
          fi
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "infra changed: $infra" >> "$GITHUB_STEP_SUMMARY"

  # platform.bicep only — app.bicep is deployed below, with the tag built here.
  # Redeploying platform is idempotent, so a push that only touches app.bicep
  # passes through this as a no-op rather than needing a finer-grained filter.
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/infra.yml
    secrets: inherit

  deploy:
    needs: [changes, infra]
    # `infra` is skipped on an app-only push, which would skip this job too
    # without an explicit condition. Run unless something actually failed.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Read straight from the platform deployment record instead of
      # duplicating these as repo secrets — they're not sensitive and this
      # keeps the workflow in sync when the infra job above has just
      # redeployed platform.bicep.
      - name: Resolve platform outputs
        id: platform
        run: |
          set -euo pipefail
          out=$(az deployment group show -g "$RESOURCE_GROUP" -n platform --query properties.outputs -o json)
          echo "acr_name=$(jq -r .acrName.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(jq -r .acrLoginServer.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "environment_id=$(jq -r .environmentId.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "identity_id=$(jq -r .identityId.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "key_vault_uri=$(jq -r .keyVaultUri.value <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:7}"
          az acr build \
            -r "${{ steps.platform.outputs.acr_name }}" \
            -t "tri-coach:$tag" \
            --platform linux/amd64 \
            .
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy new revision
        run: |
          az deployment group create \
            -g "$RESOURCE_GROUP" \
            -f infra/app.bicep \
            -p infra/app.bicepparam \
            -p environmentId="${{ steps.platform.outputs.environment_id }}" \
            -p identityId="${{ steps.platform.outputs.identity_id }}" \
            -p acrLoginServer="${{ steps.platform.outputs.acr_login_server }}" \
            -p keyVaultUri="${{ steps.platform.outputs.key_vault_uri }}" \
            -p imageTag="${{ steps.build.outputs.tag }}"
