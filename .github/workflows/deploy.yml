name: Deploy

# Builds the image on the runner, pushes it to GHCR, then SSHes into the
# One.com VPS and does `compose pull && up -d`. Replaces the Azure pair
# (deploy.yml + infra.yml): there is no infrastructure to deploy any more, so
# there is no second workflow and no OIDC.
#
# The image is public. steffanmartin/tri-coach is a public repo and the image
# adds nothing to it — the Dockerfile's only COPYs are pyproject.toml/uv.lock,
# coach/, .claude/ and entrypoint.sh, there are no build args, and every other
# layer is public software. That is what lets the VPS `docker compose pull` with
# no credential of any kind. GHCR packages default to private even for public
# repos, so the package's visibility has to be flipped once by hand after the
# first push, or the pull fails with `denied`.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time. The VPS runs exactly one container and two overlapping
# `compose up` runs would fight over it — and over deploy.env's IMAGE_TAG.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # The same 7-char sha the Azure workflow used. `latest` moves too, but
      # nothing deploys from it — deploy.env always pins a sha, which is what
      # makes a rollback a local image and a one-line edit rather than a guess.
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The VPS is x86_64 and buildx would otherwise pick the runner's
          # platform implicitly. Being explicit is free insurance.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          # NodeSource + `npm i -g @anthropic-ai/claude-code` + `uv tool install`
          # are minutes of work that change almost never. `az acr build` had no
          # cache at all, so this is a straight improvement on what it replaced.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Set the DEPLOY_TO_VPS repository variable to "true" at cutover. Until
    # then this builds and publishes but starts nothing: Telegram allows one
    # getUpdates poller per token, so a VPS container coming up while the Azure
    # revision is still running makes both fail with 409.
    if: vars.DEPLOY_TO_VPS == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned, not StrictHostKeyChecking=no: this session hands over
          # nothing secret, but it does run commands as a sudoer.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The compose file is version-controlled here and copied over on every
      # deploy, so a change to it ships through the same pipeline as a code
      # change and the box never holds an edit nobody can find.
      - name: Ship the compose file
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/tri-coach/docker-compose.yml"

      - name: Pull, restart, verify — and roll back if it never comes up
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            IMAGE_TAG="${{ needs.build.outputs.tag }}" 'bash -euo pipefail -s' <<'REMOTE'
          cd /opt/tri-coach
          previous=$(sed -n 's/^IMAGE_TAG=//p' deploy.env || true)
          echo "deploying $IMAGE_TAG (previous: ${previous:-none})"

          echo "IMAGE_TAG=$IMAGE_TAG" > deploy.env
          docker compose --env-file deploy.env pull
          docker compose --env-file deploy.env up -d --remove-orphans

          # The healthcheck curls /health inside the container, which only
          # answers once webhook.serve has opened its port — i.e. once the bot
          # imported cleanly, cloned or refreshed the vault, and started
          # polling. start_period is 90s, so allow well past it.
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' tri-coach 2>/dev/null || echo missing)
            case "$state" in
              healthy) echo "healthy"; docker image prune -f >/dev/null; exit 0 ;;
              missing) break ;;
            esac
            sleep 10
          done

          echo "::error::$IMAGE_TAG never became healthy"
          docker compose --env-file deploy.env logs --tail 120 coach || true
          if [ -n "$previous" ]; then
            echo "rolling back to $previous"
            echo "IMAGE_TAG=$previous" > deploy.env
            docker compose --env-file deploy.env up -d
          fi
          exit 1
          REMOTE
